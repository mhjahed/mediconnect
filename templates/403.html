<!-- templates/403.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>403 - Forbidden | MediConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',sans-serif;
            min-height:100vh;
            background:linear-gradient(135deg,#1E293B,#475569);
            display:flex; align-items:center; justify-content:center;
            padding:20px; color:white;
        }
        .err-card { text-align:center; max-width:540px; }
        .err-icon { font-size:96px; margin-bottom:20px; }
        .err-code {
            font-size:clamp(80px, 18vw, 160px);
            font-weight:900; letter-spacing:-6px; line-height:1;
            margin-bottom:8px; color:#F59E0B;
        }
        .err-title { font-size:28px; font-weight:800; margin-bottom:12px; }
        .err-msg { font-size:15px; color:rgba(255,255,255,0.7); margin-bottom:32px; }
        .err-btn {
            display:inline-flex; align-items:center; gap:8px;
            padding:13px 28px; border-radius:12px;
            background:#F59E0B; color:white;
            font-size:14px; font-weight:700;
            text-decoration:none;
        }
    </style>
</head>
<body>
<div class="err-card">
    <div class="err-icon">🔒</div>
    <div class="err-code">403</div>
    <div class="err-title">Access Forbidden</div>
    <div class="err-msg">You don't have permission to access this resource.</div>
    <a href="/" class="err-btn"><i class='bx bx-home'></i> Go Home</a>
</div>
</body>
</html>
